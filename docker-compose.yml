# version: '3.1'

services:
  app:
    build: .
    container_name: python_app
    depends_on:
      db:
        condition: service_healthy  # Attend que MySQL soit prêt avant de lancer l'app
    volumes:
      - .:/app
    working_dir: /app
    command: ["python", "main.py"]
    networks:
      - my_network

  db:
    image: mysql:latest
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: vde
      MYSQL_DATABASE: contact
      MYSQL_USER: vde
      MYSQL_PASSWORD: vde
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./script.sql:/docker-entrypoint-initdb.d/script.sql  # Lier le fichier script.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
      start_period: 20s
    networks:
      - my_network

volumes:
  db_data:
networks:
  my_network:
    driver: bridge
